# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# Template para o cabeçalho do changelog
header = """
# Changelog

"""

# Template para o corpo de cada versão
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""

# Template para o rodapé com links comparativos de versões
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/negronnie/exportazap/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/negronnie/exportazap/releases/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        [Unreleased]: https://github.com/negronnie/exportazap/compare/{{ releases | map(attribute="version") | first }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
# Habilita suporte ao formato Conventional Commits
conventional_commits = true
filter_unconventional = false
split_commits = false

# Agrupamento e tradução das mensagens de commit
commit_parsers = [
    { message = "^feat", group = "Funcionalidades" },
    { message = "^fix", group = "Correções de Bugs" },
    { message = "^security", group = "Segurança" },
    { message = "^sec", group = "Segurança" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refatoração" },
    { message = "^doc", group = "Documentação" },
    { message = "^docs", group = "Documentação" },
    { message = "^style", group = "Estilização" },
    { message = "^test", group = "Testes" },
    { message = "^ci", group = "CI/CD & DevOps" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore", group = "Tarefas & Manutenção" },
    { message = "^revert", group = "Reversões" },
]

# Protege alterações críticas
protect_breaking_commits = true
filter_commits = false

# Padrão de tags a considerar
tag_pattern = "v?[0-9].*"
sort_commits = "oldest"

[bump]
# Versão inicial caso ainda não existam tags anteriores no repositório
initial_tag = "v0.1.0"

