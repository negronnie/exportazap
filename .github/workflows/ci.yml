name: CI

# Roda em cada PR e em cada push na main, e é chamado pelo "Gerar Release e Tag" antes de
# gerar a versão. Todos os workflows rodam nos runners do GitHub (ubuntu-latest).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  # O evento entra no grupo para a chamada da release não cancelar o CI do push na main.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, testes, build e ponta a ponta)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Instalar o navegador dos testes
        run: npx playwright install --with-deps --only-shell chromium
      - name: Testes ponta a ponta (Playwright)
        run: npm run test:e2e
      - name: Publicar relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
