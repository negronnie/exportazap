name: Publicar Imagens

# Publica as imagens no Docker Hub (docker.io/negronnie), para amd64 e arm64, com as tags
# "latest" e a da versão (vX.Y.Z). Roda ao fim do "Gerar Release e Tag", quando alguém empurra
# uma tag v*.*.* ou à mão (a imagem sai como build-N). Precisa dos segredos DOCKERHUB_USERNAME e
# DOCKERHUB_TOKEN (um access token do Docker Hub com permissão de leitura e escrita).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Versão a publicar (a tag vX.Y.Z criada pela release)
        type: string
        required: true

concurrency:
  group: publicar-imagens
  cancel-in-progress: false

permissions:
  contents: read

env:
  NAMESPACE: negronnie

jobs:
  publicar:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        nome: [frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Chamado pela release, o commit é o da tag (com a versão nova), não o do disparo.
          ref: ${{ inputs.tag || github.ref }}

      - name: Identificar a versão da imagem
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "TAG_NAME=${{ inputs.tag }}" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=build-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: false

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.nome }}
          # O estágio de build roda na plataforma do runner; o arm64 só muda a base do nginx.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.NAMESPACE }}/zapprint-${{ matrix.nome }}:latest
            ${{ env.NAMESPACE }}/zapprint-${{ matrix.nome }}:${{ env.TAG_NAME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG_NAME }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

      - name: Anotar o que foi publicado
        run: |
          {
            echo "### ${{ matrix.nome }}"
            echo ""
            echo '```'
            echo "docker.io/${{ env.NAMESPACE }}/zapprint-${{ matrix.nome }}:latest"
            echo "docker.io/${{ env.NAMESPACE }}/zapprint-${{ matrix.nome }}:${{ env.TAG_NAME }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
