# Security headers of every response (ADR 0007). Included in each location, because an add_header
# inside a location drops the ones set at the server level.
#
# The policy allows the site's own origin only: no request can carry the chat anywhere else.
#   script-src 'wasm-unsafe-eval': the SHA-256 of the export and the PDF layout run WebAssembly;
#     it allows compiling WebAssembly only, not eval of JavaScript.
#   style-src 'unsafe-inline': React sets style attributes (participant colors, sizes).
#   img-src/media-src blob: data:: attachments are opened from the zip as object URLs.
#   worker-src blob:: zip.js runs its decompression workers from blob URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
