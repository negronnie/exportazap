server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Root and index
    root /usr/share/nginx/html;
    index index.html;

    # Favicon and app icon configuration with immediate revalidation
    location ~* ^/(favicon.*|apple-touch-icon.*)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Frontend SPA fallback. The page itself is always revalidated, so a new release shows up on the
    # next load; the assets it points to carry a hash and stay cached for a year.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
